name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirror the established Lean project cache policy.
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject unfinished proof placeholders
        shell: bash
        run: |
          if grep -R -nE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' --include='*.lean' SemigenericEPPA SemigenericEPPA.lean; then
            echo 'Unfinished proof or custom axiom found.'
            exit 1
          fi

      # Request the official complete precompiled Mathlib snapshot through
      # lean-action. The previous selective 4-target download unpacked only
      # ~730 .olean files and left 600--2300 Mathlib files for local rebuild.
      # Keep GitHub .lake caching disabled: full workspace archives are too
      # large to restore/save economically in the adjacent EPPA project.

      - name: Build and audit Lean project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          # Temporary PR-only focused build; restore main workflow before merging.
          build-args: SemigenericEPPA.Bridge.TwoColourPartiteCorollary
          use-github-cache: false
          use-mathlib-cache: true
          axiom-audit: false
          axiom-audit-root: SemigenericEPPA
          axiom-audit-allow: propext,Classical.choice,Quot.sound
